spacing_rules:
  - id: LIVE_LIVE_28D
    label_fr: Vaccins vivants — même jour ou 28 jours
    description_fr: >
      Deux vaccins vivants doivent être administrés le même jour
      ou à au moins 28 jours d'intervalle.
      Exception (G25): VPO × ROTAVIRUS exemptés.
    applies_when:
      both_live: true
    min_gap:
      days: 28
    same_day_allowed: true
    exemptions:
      - product_a: VPO
        product_b: ROTAVIRUS

  - id: PCV13TT_DTP_OFFSET_15D
    label_fr: Décalage 15 jours PrimoVax13/PCV13-TT vs vaccins DTP
    description_fr: >
      Toujours décaler de 15 jours la vaccination par PrimoVax13/
      PCV13-TT par rapport au pentavalent, DTC ou Td (fiche transition),
      dans les deux sens. La dose due en premier garde sa date; l'autre
      est décalée d'au moins 15 jours. Si les deux sont dues le même jour,
      PrimoVax est décalé. Prevenar n'est pas concerné.
    applies_when:
      pairs:
        - product_a: PCV_PRIMOVAX
          product_b: PENTA
        - product_a: PCV_PRIMOVAX
          product_b: DTC
        - product_a: PCV_PRIMOVAX
          product_b: TD
    min_gap:
      days: 15
    same_day_allowed: false
    move_on_tie: PCV_PRIMOVAX