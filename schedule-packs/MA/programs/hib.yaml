program:
  id: HIB_PROGRAM
  label_fr: Haemophilus influenzae type b
  description_fr: >
    Programme Haemophilus influenzae type b.
    Tout départ avant 12 mois : 3 doses de Penta à 4 semaines
    d'intervalle (la 3ème dose tient lieu de rappel pour les
    démarrages 6-12 mois). Après 12 mois : 1 dose suffit si
    jamais vacciné ; aucune dose si déjà ≥1 dose.
    Après 5 ans : aucune dose.
  antigen_targets:
    - HIB
  counter: HIB_DOSES

primary_series:
  required_valid_doses: 3

  dose_validity:
    - dose: 1
      min_age:
        months: 2

    - dose: 2
      min_age:
        months: 3
      min_interval_from_previous:
        weeks: 4

    - dose: 3
      min_age:
        months: 4
      min_interval_from_previous:
        weeks: 4

catchup_rules:
  - id: MA-HIB-CU-LT12M-0D
    label_fr: "moins de 12 mois, 0 dose Hib"
    when:
      age:
        to_before:
          months: 12
      counter:
        id: HIB_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
    source: RAT-2025, clinician
    confidence: official

  - id: MA-HIB-CU-LT12M-PARTIAL
    label_fr: "moins de 12 mois, vaccination partielle"
    when:
      age:
        to_before:
          months: 12
      counter:
        id: HIB_DOSES
        gte: 1
    then:
      action: complete_remaining
    source: RAT-2025, clinician
    confidence: official

  - id: MA-HIB-CU-12M-5Y-0D
    label_fr: "12 mois à 5 ans, 0 dose Hib"
    when:
      age:
        from:
          months: 12
        to_before:
          years: 5
      counter:
        id: HIB_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 1
    source: RAT-2025, clinician
    confidence: official

  - id: MA-HIB-CU-12M-5Y-GE1
    label_fr: "12 mois à 5 ans, au moins 1 dose Hib"
    when:
      age:
        from:
          months: 12
        to_before:
          years: 5
      counter:
        id: HIB_DOSES
        gte: 1
    then:
      action: complete
    source: RAT-2025, clinician
    confidence: official

  - id: MA-HIB-CU-GE5Y
    label_fr: "5 ans et plus, Hib non nécessaire"
    when:
      age:
        from:
          years: 5
    then:
      action: none
    source: RAT-2025, clinician
    confidence: official

review_flags:
  - id: HIB-REVIEW-001
    topic: Hib third dose as rappel
    question: >
      For starters aged 6-12 months the third Penta dose (4 weeks
      after dose 2) counts as the Hib rappel; no separate booster
      visit is planned. SOMIPEV's 6-month dose2-dose3 preference is
      overridden by national Penta practice.
    status: clinician_confirmed

  - id: HIB-REVIEW-002
    topic: Hib monovalent
    question: >
      No Hib monovalent in active catalog; unmet-need warning is
      emitted for 3-5 year starters. Add HIB_MONO if stock exists.
    status: needs_validation