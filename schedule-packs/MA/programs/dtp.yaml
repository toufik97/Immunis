program:
  id: DTP_PROGRAM
  label_fr: DTC / Penta
  antigen_targets:
    - DIPHTHERIA
    - TETANUS
    - PERTUSSIS
  counter: DTP_CONTAINING_DOSES

primary_series:
  required_valid_doses: 3
  booster_policy: STANDARD_DTP_BOOSTERS

  dose_validity:
    - dose: 1
      min_age:
        months: 2

    - dose: 2
      min_age:
        months: 3
      min_interval_from_previous:
        weeks: 4

    - dose: 3
      min_age:
        months: 4
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                to_before:
                  months: 12
            interval:
              weeks: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 12
            interval:
              months: 6

    - dose: 4
      min_age:
        months: 12
      min_interval_from_previous:
        months: 6

    - dose: 5
      min_age:
        years: 4
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                from:
                  months: 24
                to_before:
                  months: 60
            interval:
              years: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 60
            interval:
              years: 1

booster_policies:
  - id: STANDARD_DTP_BOOSTERS
    label_fr: Rappels DTC standard

    booster_1:
      product_group:
        conditional:
          - when:
              age_at_dose:
                to_before:
                  years: 7
            product: DTC
          - when:
              age_at_dose:
                from:
                  years: 7
            product: TD
      min_age:
        months: 18
      min_interval_after_primary_completion:
        months: 6

    booster_2:
      product_group:
        conditional:
          - when:
              age_at_dose:
                to_before:
                  years: 7
            product: DTC
          - when:
              age_at_dose:
                from:
                  years: 7
            product: TD
      min_age:
        years: 5
      min_interval_after_booster_1:
        conditional:
          - when:
              age_at_previous_dose:
                from:
                  months: 24
                to_before:
                  months: 60
            interval:
              years: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 60
            interval:
              years: 1
              
catchup_rules:
  - id: MA-DTP-CU-0D-LT12M
    when:
      age:
        to_before:
          months: 12
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-0D-12M-LT3Y
    when:
      age:
        from:
          months: 12
        to_before:
          years: 3
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-0D-3Y-LT7Y
    when:
      age:
        from:
          years: 3
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-1D-LT18M
    when:
      age:
        to_before:
          months: 18
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 2
