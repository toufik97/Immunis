  - id: MA-DTP-CU-1D-18M-LT3Y
    when:
      age:
        from:
          months: 18
        to_before:
          years: 3
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 2
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-1D-3Y-LT7Y
    when:
      age:
        from:
          years: 3
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 2
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-2D-LT18M
    when:
      age:
        to_before:
          months: 18
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 2
    then:
      action: complete_primary
      doses_needed: 1
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-2D-18M-LT3Y
    when:
      age:
        from:
          months: 18
        to_before:
          years: 3
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 2
    then:
      action: complete_primary
      doses_needed: 1
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-2D-3Y-LT7Y
    when:
      age:
        from:
          years: 3
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 2
    then:
      action: complete_primary
      doses_needed: 1
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-3D-LT18M
    when:
      age:
        to_before:
          months: 18
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 3
    then:
      action: schedule_booster
      booster_sequence: 1
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-3D-18M-LT7Y
    when:
      age:
        from:
          months: 18
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 3
    then:
      action: give_booster_if_due
      booster_sequence: 1
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-4D-LT5Y
    when:
      age:
        to_before:
          years: 5
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 4
    then:
      action: schedule_booster
      booster_sequence: 2
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-4D-5Y-LT7Y
    when:
      age:
        from:
          years: 5
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 4
    then:
      action: give_booster_if_due
      booster_sequence: 2
      booster_policy: STANDARD_DTP_BOOSTERS

  - id: MA-DTP-CU-5D-LT7Y
    when:
      age:
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        gte: 5
    then:
      action: complete

  - id: MA-DTP-CU-GE7Y
    when:
      age:
        from:
          years: 7
    then:
      action: none

dose_caps:
  - counter: DT_CONTAINING_DOSES
    max_doses: 6
    before_age:
      months: 84

review_flags:
  - id: DTP-REVIEW-001
    topic: Dose 5 / booster 2 interval has no branch below 24 months
    question: >
      Intentional (G14 routine-window exemption). When booster 1 is given
      before 24 months (the routine 18-month window), no extra interval is
      enforced beyond the min_age floor. The 4-year / 1-year branches apply
      only to a late (catch-up) booster 1. Locked by tests B13, B17 and G14;
      do not add a <24m branch without updating them.
    status: policy_decision