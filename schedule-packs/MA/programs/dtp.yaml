review_flags:
  - id: DTP-REVIEW-001
    topic: Penta maximum age
    question: >
      Is Penta allowed up to <3 years in all catch-up cases,
      and never after 3 years?
    status: needs_validation

  - id: DTP-REVIEW-002
    topic: Td after 7 years
    question: >
      Does Td count toward the 5-dose DTC/Td requirement?
      What about pertussis protection after 7 years?
    status: needs_validation

  - id: DTP-REVIEW-003
    topic: 2 previous doses, 3 to <7 years
    question: >
      Confirm interpretation for 2 DTC doses 6 months apart.
    status: needs_validation

  - id: DTP-REVIEW-004
    topic: Invalid early dose
    question: >
      If a DTP/Penta dose was given too early,
      should it be ignored and repeated?
    status: needs_validation

  - id: DTP-REVIEW-005
    topic: 4 doses under 5 years
    question: >
      Confirm waiting logic for second booster.
    status: needs_validation

  - id: DTP-REVIEW-006
    topic: Dose 2 to 3 interval conflict
    question: >
      2020 webinar says 6 months between dose 2 and 3 for children over 1 year.
      2025 document says 1 month interval for 12m-3y catch-up.
      Clinician confirmed 6 months for dose 2 to 3 when child is over 1 year.
    status: clinician_confirmed