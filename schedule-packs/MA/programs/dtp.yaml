program:
  id: DTP_PROGRAM
  label_fr: DTC / Penta
  description_fr: >
    Programme diphtérie, tétanos, coqueluche.
    Les doses Penta et DTC sont comptées comme doses DTP.
    Le choix du produit (Penta ou DTC) est délégué au sélecteur de produits.
  antigen_targets:
    - DIPHTHERIA
    - TETANUS
    - PERTUSSIS
  counter: DTP_CONTAINING_DOSES

primary_series:
  required_valid_doses: 3

  dose_validity:
    - dose: 1
      min_age:
        months: 2
      min_interval_from_previous: null

    - dose: 2
      min_age:
        months: 3
      min_interval_from_previous:
        weeks: 4

    - dose: 3
      min_age:
        months: 4
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                to_before:
                  months: 12
            interval:
              weeks: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 12
            interval:
              months: 6 
booster_policies:
  - id: STANDARD_DTP_BOOSTERS
    label_fr: Rappels DTC standard
    booster_1:
      product_group: DTC
      min_age:
        months: 18
      min_interval_after_primary_completion:
        months: 6
    booster_2:
      product_group: DTC
      min_age:
        years: 5
      min_interval_after_booster_1:
        years: 4

catchup_rules:
  # --------------------------------------------------
  # 0 previous valid DTP-containing dose
  # --------------------------------------------------
  - id: MA-DTP-CU-0D-LT12M
    label_fr: "0 dose, moins de 12 mois"
    when:
      age:
        to_before:
          months: 12
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS
    source: RAT-2025
    confidence: official

  - id: MA-DTP-CU-0D-12M-LT3Y
    label_fr: "0 dose, 12 mois à moins de 3 ans"
    when:
      age:
        from:
          months: 12
        to_before:
          years: 3
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS
    source: RAT-2025
    confidence: official

  - id: MA-DTP-CU-0D-3Y-LT7Y
    label_fr: "0 dose, 3 ans à moins de 7 ans"
    when:
      age:
        from:
          years: 3
        to_before:
          years: 7
      counter:
        id: DTP_CONTAINING_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: STANDARD_DTP_BOOSTERS
    source: WEB-2020, RAT-2025
    confidence: draft

  # --------------------------------------------------
  # 1 previous valid DTP-containing dose
