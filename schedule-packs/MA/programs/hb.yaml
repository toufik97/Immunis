program:
  id: HB_PROGRAM
  label_fr: Hépatite B
  antigen_targets:
    - HB
  counter: HB_DOSES

primary_series:
  required_valid_doses: 3
  
  birth_dose:
    product_group: HB_MONO
    counts_as_dose: 1
    plan_if_age_below:
      weeks: 4
  
  dose_validity:
    - dose: 1
      min_age:
        birth: true

    - dose: 2
      min_age:
        months: 1
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                to_before:
                  months: 132
            interval:
              months: 1
          - when:
              age_at_previous_dose:
                from:
                  months: 132
                to_before:
                  months: 192
            interval:
              months: 6
          - when:
              age_at_previous_dose:
                from:
                  months: 192
            interval:
              months: 1

    - dose: 3
      min_age:
        months: 3
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                to_before:
                  months: 12
            interval:
              weeks: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 12
            interval:
              months: 6

catchup_rules:
  - id: MA-HB-CU-LT11Y-0D
    when:
      age:
        to_before:
          years: 11
      counter:
        id: HB_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3

  - id: MA-HB-CU-LT11Y-1D
    when:
      age:
        to_before:
          years: 11
      counter:
        id: HB_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 2

  - id: MA-HB-CU-LT11Y-2D
    when:
      age:
        to_before:
          years: 11
      counter:
        id: HB_DOSES
        equals: 2
    then:
      action: complete_primary
      doses_needed: 1

  - id: MA-HB-CU-LT11Y-GE3
    when:
      age:
        to_before:
          years: 11
      counter:
        id: HB_DOSES
        gte: 3
    then:
      action: complete

  - id: MA-HB-CU-11Y-16Y-0D
    when:
      age:
        from:
          years: 11
        to_before:
          years: 16
      counter:
        id: HB_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 2

  - id: MA-HB-CU-11Y-16Y-1D
    when:
      age:
        from:
          years: 11
        to_before:
          years: 16
      counter:
        id: HB_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 1

  - id: MA-HB-CU-11Y-16Y-GE2
    when:
      age:
        from:
          years: 11
        to_before:
          years: 16
      counter:
        id: HB_DOSES
        gte: 2
    then:
      action: complete

  - id: MA-HB-CU-GE16Y-0D
    when:
      age:
        from:
          years: 16
      counter:
        id: HB_DOSES
        equals: 0
    then:
      action: complete_primary
      doses_needed: 3

  - id: MA-HB-CU-GE16Y-1D
    when:
      age:
        from:
          years: 16
      counter:
        id: HB_DOSES
        equals: 1
    then:
      action: complete_primary
      doses_needed: 2

  - id: MA-HB-CU-GE16Y-2D
    when:
      age:
        from:
          years: 16
      counter:
        id: HB_DOSES
        equals: 2
    then:
      action: complete_primary
      doses_needed: 1

  - id: MA-HB-CU-GE16Y-GE3
    when:
      age:
        from:
          years: 16
      counter:
        id: HB_DOSES
        gte: 3
    then:
      action: complete