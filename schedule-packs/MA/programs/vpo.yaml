program:
  id: VPO_PROGRAM
  label_fr: Poliomyélite orale (VPO)
  antigen_targets:
    - POLIO_ORAL
  counter: POLIO_ORAL_DOSES

primary_series:
  required_valid_doses: 3
  booster_policy: VPO_BOOSTERS

  birth_dose:
    product_group: VPO
    counts_as_dose: 0
    plan_if_age_below:
      weeks: 4
  dose_zero:             # <--- ADD THIS BLOCK
    product_groups:
      - VPO
    max_age:
      months: 2

  dose_validity:
    - dose: 1
      min_age:
        months: 2

    - dose: 2
      min_age:
        months: 3
      min_interval_from_previous:
        weeks: 4

    - dose: 3
      min_age:
        months: 4
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                to_before:
                  months: 12
            interval:
              weeks: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 12
            interval:
              months: 6

    - dose: 4
      min_age:
        months: 12
      min_interval_from_previous:
        months: 6

    - dose: 5
      min_age:
        years: 4
      min_interval_from_previous:
        conditional:
          - when:
              age_at_previous_dose:
                from:
                  months: 24
                to_before:
                  months: 60
            interval:
              years: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 60
            interval:
              years: 1

booster_policies:
  - id: VPO_BOOSTERS
    label_fr: Rappels VPO

    booster_1:
      product_group: VPO
      min_age:
        months: 18
      min_interval_after_primary_completion:
        months: 6

    booster_2:
      product_group: VPO
      min_age:
        years: 5
      min_interval_after_booster_1:
        conditional:
          - when:
              age_at_previous_dose:
                from:
                  months: 24
                to_before:
                  months: 60
            interval:
              years: 4
          - when:
              age_at_previous_dose:
                from:
                  months: 60
            interval:
              years: 1

catchup_rules:
  - id: MA-VPO-CU-0D
    when:
      counter: { id: POLIO_ORAL_DOSES, equals: 0 }
    then:
      action: complete_primary
      doses_needed: 3
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-1D
    when:
      counter: { id: POLIO_ORAL_DOSES, equals: 1 }
    then:
      action: complete_primary
      doses_needed: 2
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-2D
    when:
      counter: { id: POLIO_ORAL_DOSES, equals: 2 }
    then:
      action: complete_primary
      doses_needed: 1
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-3D-LT18M
    when:
      age: { to_before: { months: 18 } }
      counter: { id: POLIO_ORAL_DOSES, equals: 3 }
    then:
      action: schedule_booster
      booster_sequence: 1
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-3D-GE18M
    when:
      age: { from: { months: 18 } }
      counter: { id: POLIO_ORAL_DOSES, equals: 3 }
    then:
      action: give_booster_if_due
      booster_sequence: 1
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-4D
    when:
      counter: { id: POLIO_ORAL_DOSES, equals: 4 }
    then:
      action: give_booster_if_due
      booster_sequence: 2
      booster_policy: VPO_BOOSTERS

  - id: MA-VPO-CU-GE5
    when:
      counter: { id: POLIO_ORAL_DOSES, gte: 5 }
    then:
      action: complete


review_flags:
  - id: VPO-REVIEW-001
    topic: Dose zero window
    question: >
      Birth dose window set to <2 months (aligned with Penta1).
      WHO uses 6 weeks as the primary-series start; a VPO at 6 weeks
      is therefore treated as dose 0 here. Needs validation.
    status: needs_validation
  - id: VPO-REVIEW-002
    topic: Campaign doses
    question: >
      National campaign VPO doses are NOT recorded in history (WHO:
      they do not count toward the routine series). A campaign flag
      may be added later.
    status: policy_decision
  - id: VPO-REVIEW-003
    topic: No upper age limit for VPO
    question: >
      Age ceiling removed by clinician ruling: VPO recommendations
      now follow dose count at any age (adult OPV schemas not
      separately reviewed).
    status: clinician_confirmed